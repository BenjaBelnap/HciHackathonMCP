version: "3.8"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hci-sqlserver
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "SqlPassword123!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S", "localhost",
          "-U", "sa",
          "-P", "SqlPassword123!",
          "-Q", "SELECT 1",
          "-b",
          "-C",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

volumes:
  sqlserver_data:
